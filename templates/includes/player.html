{# Fixed bottom player bar (Dev 3). Hidden until a track is played. Controlled by static/js/player.js #}
<div id="player" class="player-bar" role="region" aria-label="Music player" hidden>
  <audio id="audio" preload="metadata"></audio>

  <div class="player-track">
    <img id="player-cover" src="" alt="" class="player-cover" hidden>
    <div id="player-cover-placeholder" class="player-cover player-cover-placeholder" aria-hidden="true">
      <i class="bi bi-music-note"></i>
    </div>
    <div class="text-truncate">
      <div id="player-title" class="fw-semibold text-truncate">Nothing playing</div>
      <div id="player-artist" class="small text-secondary text-truncate"></div>
    </div>
  </div>

    <div class="player-controls">
    <button id="btn-prev" type="button" class="btn btn-link text-light player-skip" aria-label="Previous track">
      <i class="bi bi-skip-start-fill" aria-hidden="true"></i>
    </button>
    <button id="btn-play" type="button" class="btn btn-light rounded-circle player-play" aria-label="Play">
      <i class="bi bi-play-fill" aria-hidden="true"></i>
    </button>
    <button id="btn-next" type="button" class="btn btn-link text-light player-skip" aria-label="Next track">
      <i class="bi bi-skip-end-fill" aria-hidden="true"></i>
    </button>
  </div>

  <div class="player-right">
    <p id="player-status" class="player-status small mb-0" role="status" aria-live="polite"></p>
    <div class="player-volume">
      <i id="volume-icon" class="bi bi-volume-up" aria-hidden="true"></i>
      <label for="volume" class="visually-hidden">Volume</label>
      <input id="volume" type="range" class="form-range" min="0" max="1" step="0.01" value="0.8"
             aria-valuetext="80%">
    </div>
  </div>
</div>
