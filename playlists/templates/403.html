{% extends "base.html" %}
{% block title %}Private | Mini Spotify{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-lock display-4 text-secondary" aria-hidden="true"></i>
  <h1 class="h3 mt-3">This is private</h1>
  <p class="text-secondary">You don't have permission to view this page.</p>
  {% if not user.is_authenticated %}
    <a class="btn btn-success" href="{% url 'login' %}?next={{ request.path|urlencode }}">Log in</a>
  {% endif %}
  <a class="btn btn-outline-light" href="{% url 'home' %}">Go home</a>
</div>
{% endblock %}
