{% extends "base.html" %}
{% block title %}New playlist | Mini Spotify{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <h1 class="h3 mb-3">New playlist</h1>
  <form method="post">{% csrf_token %}
    {% include "includes/form_fields.html" %}  {# shows fields + the duplicate-name error #}
    <button class="btn btn-success" type="submit">Create playlist</button>
    <a class="btn btn-outline-light" href="{% url 'playlist_list' %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
